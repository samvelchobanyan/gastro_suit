    <x-import component-from-global-scope="GastroDesignSystem_472aed.Stories" image-url="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200&h=200&fit=crop&q=80" label="Espresso" seen="{{ false }}" style="flex:0 0 auto" hint-size="72px,92px"></x-import>
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Stories" image-url="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=200&h=200&fit=crop&q=80" label="Pastries" seen="{{ true }}" style="flex:0 0 auto" hint-size="72px,92px"></x-import>
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Stories" image-url="https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=200&h=200&fit=crop&q=80" label="Beans" seen="{{ true }}" style="flex:0 0 auto" hint-size="72px,92px"></x-import>
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Stories" image-url="https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=200&h=200&fit=crop&q=80" label="Mocha" seen="{{ true }}" style="flex:0 0 auto" hint-size="72px,92px"></x-import>
  </div>

  <!-- Loyalty points card -->

    <x-import component-from-global-scope="GastroDesignSystem_472aed.LoyaltyPointsCard" points="{{ 1240 }}" membership="Master" discount-label="10%" qr-value="CH-ARAM-1240" background-image="uploads/ch_loyalty_bg-19967daa.png" hint-size="328px,116px"></x-import>
  </div>

  <!-- Wallet -->
  <div style="padding: 0 var(--space-base) var(--space-base);">
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Wallet" balance="֏5,680" icon="uploads/ch_wallet.png" hint-size="328px,80px"></x-import>
  </div>

  <!-- Vouchers -->
  <div style="padding: 0 0 var(--space-lg);">
    <div style="padding: 0 var(--space-base); margin-bottom: var(--space-md);"><x-import component-from-global-scope="GastroDesignSystem_472aed.SectionHeader" title="Vouchers" hint-size="100%,28px"></x-import></div>
    <div style="display: flex; gap: var(--space-sm); overflow-x: auto; padding: 0 var(--space-base); scrollbar-width: none;">
      <div style="flex:0 0 auto;"><x-import component-from-global-scope="GastroDesignSystem_472aed.Voucher" name="Bumble Cherry" remaining="{{ 2 }}" image="uploads/ch_voucher_bumble_cherry.png" hint-size="auto,72px"></x-import></div>
      <div style="flex:0 0 auto;"><x-import component-from-global-scope="GastroDesignSystem_472aed.Voucher" name="Iced Americano Specialty Arabica" remaining="{{ 1 }}" image="uploads/ch_voucher_iced_americano_specialty_arabica.png" hint-size="auto,72px"></x-import></div>
    </div>
  </div>

  <!-- Tabs (small) -->
  <div style="padding: 0 var(--space-base) var(--space-base);">
    <x-import component-from-global-scope="GastroDesignSystem_472aed.TabBar" size="small" full-width="{{ false }}" options="{{ tabOptions }}" value="{{ tabValue }}" on-change="{{ setTab }}" hint-size="auto,32px"></x-import>
  </div>

  <!-- Buy again rail -->
  <sc-if value="{{ showBuyAgain }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; gap: var(--space-sm); overflow-x: auto; padding: 0 var(--space-base) var(--space-lg); scrollbar-width: none;">
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.BuyAgainCard" name="Hot Salted Caramel Matcha Latte" location="Northern Ave" image-url="uploads/ch_prod_hot_salted_caramel_matcha_latte.png" style="flex:0 0 128px" hint-size="128px,180px"></x-import></div>
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.BuyAgainCard" name="Dubai Cheesecake" location="Cascade" image-url="uploads/ch_prod_dubai_cheesecake.png" style="flex:0 0 128px" hint-size="128px,180px"></x-import></div>
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.BuyAgainCard" name="Muffin Chocolate" location="Republic Sq" image-url="uploads/ch_prod_muffin_chocolate.png" style="flex:0 0 128px" hint-size="128px,180px"></x-import></div>
  </div>
  </sc-if>

  <!-- Favourites rail -->
  <sc-if value="{{ showFavourites }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; gap: var(--space-sm); overflow-x: auto; padding: 0 var(--space-base) var(--space-lg); scrollbar-width: none;">
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.ProductVerticalCard" name="Iced Fantasy Coffee" price="֏1,450" image-url="uploads/ch_fav_iced_fantasy_coffee.png" hint-size="128px,180px"></x-import></div>
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.ProductVerticalCard" name="Iced Cream Cheese Latte Aroma" price="֏1,850" image-url="uploads/ch_fav_iced_cream_cheese_latte_aroma.png" hint-size="128px,180px"></x-import></div>
    <div style="flex:0 0 128px"><x-import component-from-global-scope="GastroDesignSystem_472aed.ProductVerticalCard" name="Hot Raf Strawberry" price="֏1,650" image-url="uploads/ch_fav_hot_raf_strawberry.png" hint-size="128px,180px"></x-import></div>
  </div>

  <div style="display: flex; gap: var(--space-sm); overflow-x: auto; padding: 0 var(--space-base) var(--space-lg); scrollbar-width: none;">

    <a href="#" style="flex:0 0 280px; display:block; border-radius: var(--radius-md, 16px); overflow: hidden; box-shadow: var(--elevation-card);"><img src="uploads/promo_2.png" alt="App exclusive combos" style="width:100%; aspect-ratio: 512/264; object-fit: cover; display:block;"></a>

    <div style="display: flex; flex-direction: column; gap: var(--space-md);">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.BranchCard" name="Northern Avenue" address="12 Northern Ave, Yerevan" hours="08:00 – 23:00" distance="0.4 km" is-open-now="{{ true }}" on-click="{{ noop }}" image="uploads/branch_1.png" hint-size="100%,72px"></x-import>
      <x-import component-from-global-scope="GastroDesignSystem_472aed.Divider" hint-size="100%,1px"></x-import>
      <x-import component-from-global-scope="GastroDesignSystem_472aed.BranchCard" name="Cascade" address="3 Tamanyan St, Yerevan" hours="09:00 – 22:00" distance="1.1 km" is-open-now="{{ true }}" on-click="{{ noop }}" image="uploads/branch_2.png" hint-size="100%,72px"></x-import>
      <x-import component-from-global-scope="GastroDesignSystem_472aed.Divider" hint-size="100%,1px"></x-import>
      <x-import component-from-global-scope="GastroDesignSystem_472aed.BranchCard" name="Republic Square" address="5 Abovyan St, Yerevan" hours="08:00 – 00:00" distance="1.8 km" is-open-now="{{ false }}" on-click="{{ noop }}" image="uploads/branch_3.png" hint-size="100%,72px"></x-import>

    <x-import component-from-global-scope="GastroDesignSystem_472aed.BottomNavigation" items="{{ navItems }}" active-key="{{ navActive }}" on-change="{{ setNav }}" hint-size="100%,56px"></x-import>
  </div>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'buy-again', nav: 'home' };
  renderVals() {
    return {
      tabOptions: [
        { label: 'Buy again', value: 'buy-again', icon: 'arrow-counter-clockwise' },
        { label: 'Favourites', value: 'favourites', icon: 'heart' },
      ],
      noop: () => {},
      navItems: [
        { key: 'home', icon: 'house', label: 'Home' },
        { key: 'order', icon: 'coffee', label: 'Order' },
        { key: 'gifts', icon: 'gift', label: 'Gifts' },
        { key: 'profile', icon: 'user', label: 'Profile' },
      ],
      navActive: this.state.nav,
      setNav: (k) => {
        const routes = { home: 'Home.dc.html', order: 'Order.dc.html' };
        if (routes[k] && k !== this.state.nav) { window.location.href = routes[k]; return; }
        this.setState({ nav: k });
      },
      tabValue: this.state.tab,
      showBuyAgain: this.state.tab === 'buy-again',
      showFavourites: this.state.tab === 'favourites',
      setTab: (v) => this.setState({ tab: v }),
    };
  }
}
</script>
