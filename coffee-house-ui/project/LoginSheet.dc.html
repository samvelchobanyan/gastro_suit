<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/primitives.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/brand.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/typography.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/radius.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/sizing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/motion.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/components.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/base.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/styles.css">
  <script src="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<div style="position: absolute; inset: 0; z-index: 60; pointer-events: {{ pe }}; overflow: hidden;">
  <div onClick="{{ close }}" style="position: absolute; inset: 0; background: var(--alpha-black-40); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: {{ scrimOpacity }}; transition: opacity var(--duration-slow, 300ms) ease;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; transform: {{ sheetTransform }}; transition: transform var(--duration-slow, 300ms) cubic-bezier(0.2, 0, 0, 1); border-radius: var(--radius-xl) var(--radius-xl) 0 0; overflow: hidden; background: color-mix(in oklab, var(--gray-1000, #000) 78%, transparent); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); box-shadow: {{ sheetShadow }}; font-family: var(--font-family-base);">
    <div aria-hidden="true" style="position: absolute; top: -140px; left: -100px; width: 300px; height: 300px; border-radius: 50%; background: var(--gray-0); opacity: 0.08; filter: blur(80px); pointer-events: none;"></div>
    <div aria-hidden="true" style="position: absolute; bottom: -100px; right: -90px; width: 260px; height: 260px; border-radius: 50%; background: var(--accent-500); opacity: 0.22; filter: blur(90px); pointer-events: none;"></div>
    <div style="position: relative; display: flex; justify-content: center; padding-top: var(--space-sm);">
      <div style="width: 36px; height: 4px; border-radius: var(--radius-full); background: color-mix(in oklab, var(--gray-0) 35%, transparent);"></div>
    </div>
    <div style="position: relative; display: flex; justify-content: flex-end; padding: 0 var(--space-xs); color: var(--gray-0); --color-text-primary: var(--gray-0);">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.IconButton" icon="x" variant="ghost" size="md" aria-label="Close" on-click="{{ close }}" hint-size="48px,48px"></x-import>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--space-lg); padding: 0 var(--space-base);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-base); text-align: center;">
        <img src="{{ heroImg }}" alt="" style="width: 110px; height: 110px; object-fit: contain; display: block;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-xs);">
          <sc-if value="{{ isPhoneStep }}" hint-placeholder-val="{{ true }}">
            <span style="font: var(--text-h2); color: var(--gray-0);">Log in</span>
            <span style="font: var(--text-body); color: var(--gray-500); text-wrap: pretty;">Enter your phone number and we'll send you a verification code.</span>
          </sc-if>
          <sc-if value="{{ isCodeStep }}" hint-placeholder-val="{{ false }}">
            <span style="font: var(--text-h2); color: var(--gray-0);">Enter code</span>
            <span style="font: var(--text-body); color: var(--gray-500); text-wrap: pretty;">Enter the 4 digit code sent to {{ phoneDisplay }}. <button type="button" onClick="{{ resend }}" style="padding: 0; border: none; background: transparent; cursor: pointer; font: var(--text-body-semibold); color: var(--gray-0); text-decoration: none;">{{ resendLabel }}</button> · <button type="button" onClick="{{ changeNumber }}" style="padding: 0; border: none; background: transparent; cursor: pointer; font: var(--text-body-semibold); color: var(--gray-0); text-decoration: none;">Change number</button></span>
          </sc-if>
        </div>
      </div>
      <sc-if value="{{ isCodeStep }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; justify-content: center; gap: var(--space-sm);">
            <sc-for list="{{ cells }}" as="c" hint-placeholder-count="4">
              <x-import component-from-global-scope="GastroDesignSystem_472aed.InputCode" value="{{ c.value }}" input-ref="{{ c.ref }}" on-change="{{ c.onChange }}" on-key-down="{{ c.onKeyDown }}" disabled="{{ checking }}" aria-label="{{ c.label }}" hint-size="48px,48px"></x-import>
            </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isPhoneStep }}" hint-placeholder-val="{{ true }}">
      <div style="align-self: stretch; position: relative;" onFocus="{{ phoneFocus }}" onBlur="{{ phoneBlur }}">
        <x-import component-from-global-scope="GastroDesignSystem_472aed.Input" type="tel" value="{{ phone }}" on-change="{{ setPhone }}" placeholder="+374" leading-icon="phone" size="lg" hint-size="100%,48px"></x-import>
        <sc-if value="{{ hasPhone }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-label="Clear phone number" onClick="{{ clearPhone }}" style="position: absolute; top: 50%; right: var(--space-xs); transform: translateY(-50%); width: 32px; height: 32px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-tertiary);"><i class="ph ph-x" style="font-size: var(--icon-sm);"></i></button>
        </sc-if>
      </div>
      </sc-if>
    </div>
    <div style="position: relative; padding: var(--space-base) var(--space-base) calc(var(--space-base) + env(safe-area-inset-bottom, 0px));">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.Button" variant="primary" size="md" radius="full" full-width="{{ true }}" disabled="{{ ctaDisabled }}" on-click="{{ cta }}" hint-size="100%,48px"><span style="display: flex; align-items: center; gap: var(--space-sm);"><sc-if value="{{ checking }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="GastroDesignSystem_472aed.Spinner" size="{{ 20 }}" on-dark="{{ true }}" hint-size="20px,20px"></x-import></sc-if>{{ ctaLabel }}</span></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:800},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSend&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(phone: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { phone: '', step: 'phone', code: ['', '', '', ''], checking: false, resent: false };
  refs = [React.createRef(), React.createRef(), React.createRef(), React.createRef()];
  componentDidUpdate(prev) {
    if (prev.open && !this.props.open) { clearTimeout(this.t); this.setState({ step: 'phone', code: ['', '', '', ''], checking: false, resent: false }); }
  }
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.rt); }
  setDigit(i, v) {
    const code = [...this.state.code]; code[i] = v;
    this.setState({ code });
    if (v && this.refs[i + 1] && this.refs[i + 1].current) this.refs[i + 1].current.focus();
    if (code.every(d => d)) {
      if (this.refs[i].current) this.refs[i].current.blur();
      this.setState({ checking: true });
      this.t = setTimeout(() => { window.location.href = 'Home.dc.html'; }, 1500);
    }
  }
  renderVals() {
    const s = this.state;
    const open = !!this.props.open;
    const onClose = this.props.onClose ?? (() => {});
    const p = s.phone;
    const isCode = s.step === 'code';
    return {
      pe: open ? 'auto' : 'none',
      sheetTransform: open ? 'translateY(0)' : 'translateY(100%)',
      scrimOpacity: open ? 1 : 0,
      sheetShadow: open ? 'var(--elevation-sheet)' : 'none',
      close: () => onClose(),
      heroImg: isCode ? 'uploads/login_code.png' : 'uploads/login_phone.png',
      isPhoneStep: !isCode,
      isCodeStep: isCode,
      phoneDisplay: '+374 ' + p.slice(0, 2) + ' ' + p.slice(2, 5) + ' ' + p.slice(5),
      phone: (p || s.phoneFocused) ? '+374 ' + p : '',
      phoneFocus: (e) => {
        const el = e.target;
        this.setState({ phoneFocused: true }, () => requestAnimationFrame(() => { if (el && el.setSelectionRange) { const n = el.value.length; el.setSelectionRange(n, n); } }));
      },
      phoneBlur: () => this.setState({ phoneFocused: false }),
      setPhone: (v) => {
        let t = String(v && v.target ? v.target.value : v);
        t = t.startsWith('+374') ? t.slice(4) : t;
        this.setState({ phone: t.replace(/\D/g, '').slice(0, 8) });
      },
      hasPhone: p.length > 0,
      clearPhone: () => this.setState({ phone: '' }),
      cells: s.code.map((d, i) => ({
        value: d, ref: this.refs[i], label: 'Code digit ' + (i + 1),
        onChange: (v) => this.setDigit(i, v),
        onKeyDown: (e) => { if (e.key === 'Backspace' && !d && this.refs[i - 1] && this.refs[i - 1].current) this.refs[i - 1].current.focus(); },
      })),
      checking: s.checking,
      resendLabel: s.resent ? 'Sent' : 'Resend code',
      resend: () => { this.setState({ resent: true, code: ['', '', '', ''] }); clearTimeout(this.rt); this.rt = setTimeout(() => this.setState({ resent: false }), 3000); if (this.refs[0].current) this.refs[0].current.focus(); },
      changeNumber: () => { clearTimeout(this.t); this.setState({ step: 'phone', code: ['', '', '', ''], checking: false }); },
      ctaLabel: isCode ? (s.checking ? 'Checking' : 'Verify') : 'Send code',
      ctaDisabled: isCode ? !s.code.every(d => d) : p.length < 8,
      cta: () => {
        if (!isCode) { this.setState({ step: 'code' }, () => setTimeout(() => { if (this.refs[0].current) this.refs[0].current.focus(); }, 50)); (this.props.onSend ?? (() => {}))(p); }
      },
    };
  }
}
</script>
</body>
</html>
