<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/primitives.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/brand.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/typography.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/radius.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/sizing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/motion.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/components.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/base.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/styles.css">
  <script src="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: var(--space-lg) 0; background: var(--gray-100); font-family: "Plus Jakarta Sans", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    a { color: var(--color-text-primary); } a:hover { color: var(--color-text-secondary); }
  </style>
</helmet>
<div data-screen-label="Bank cards" style="width: 360px; height: 800px; background: var(--color-bg-surface); overflow: hidden; display: flex; flex-direction: column; flex: 0 0 auto; position: relative;">
  <x-import component-from-global-scope="GastroDesignSystem_472aed.ScreenHeader" title="Bank cards" on-back="{{ goBack }}" action="{{ addButton }}" hint-size="100%,56px"></x-import>
  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 var(--space-base) var(--space-base); display: flex; flex-direction: column; gap: var(--space-sm);">
    <div style="display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-radius: var(--radius-md); background: var(--gray-900); font-family: var(--font-family-base);">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
        <span style="font: var(--text-body-semibold); color: var(--gray-0);">Attach your bank card</span>
        <span style="font: var(--text-body-sm); color: var(--gray-500);">to buy products, gifts and vouchers</span>
      </div>
      <img src="uploads/bank_card-e6bb4dc6.png" alt="" style="width: 64px; height: 64px; object-fit: contain; flex: 0 0 auto; display: block;">
    </div>
    <div style="padding-top: var(--space-base);">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.SectionHeader" title="Attached cards" hint-size="100%,28px"></x-import>
    </div>
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.BankCard" brand="{{ c.brand }}" number="{{ c.number }}" on-delete="{{ c.remove }}" hint-size="100%,64px"></x-import>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = { cards: [
    { id: 1, brand: 'visa', number: '4556' },
    { id: 2, brand: 'mastercard', number: '8821' },
    { id: 3, brand: 'arca', number: '3107' },
  ] };
  renderVals() {
    const DS = window.GastroDesignSystem_472aed;
    return {
      addButton: DS && DS.IconButton ? React.createElement(DS.IconButton, { icon: 'plus', variant: 'tonal', size: 'sm', ariaLabel: 'Add card', onClick: () => {} }) : null,
      goBack: () => { window.location.href = 'Profile.dc.html'; },
      cards: this.state.cards.map(c => ({ ...c, remove: () => this.setState(s => ({ cards: s.cards.filter(x => x.id !== c.id) })) })),
    };
  }
}
</script>
</body>
</html>
