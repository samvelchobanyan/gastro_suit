  <style>
    body { margin: 0; background: #e9e7e2; font-family: "Plus Jakarta Sans", system-ui, sans-serif; padding: 32px; }
    a { color: var(--accent-400, #F14D53); }
    a:hover { color: var(--accent-300, #F47A7E); }
    @keyframes chStreamIn {
      0%   { transform: translateX(-50%) scaleX(.3) scaleY(0); }
      55%  { transform: translateX(-50%) scaleX(.45) scaleY(.62); }
      100% { transform: translateX(-50%) scaleX(1) scaleY(1); }

    @keyframes chGlint { 0% { transform: translateY(-80px); opacity: 0; } 20% { opacity: .9; } 80% { opacity: .9; } 100% { transform: translateY(368px); opacity: 0; } }
    @keyframes chWobble { 0%, 100% { transform: translateX(calc(-50% - .8px)) scaleY(1); } 50% { transform: translateX(calc(-50% + .8px)) scaleY(1); } }
    @keyframes chBead {
      0%   { transform: translate(-50%, 30px) scale(.7, 1.5); opacity: 0; }

      88%  { opacity: .95; }
      100% { transform: translate(-50%, 356px) scale(1.15, 2.1); opacity: 0; }
    }
    @keyframes chSatL {
      0%   { transform: translate(0, 0) scale(.4); opacity: 0; }

      0%   { transform: translate(0, 0) scale(.4); opacity: 0; }

      100% { transform: translate(22px, 5px) scale(.5); opacity: 0; }

    @keyframes chStreamSway { 0%, 100% { transform: translateX(-50%) scaleX(1); } 50% { transform: translateX(-50%) scaleX(1.5); } }
    @keyframes chDrop {
      0%   { transform: translate(-50%, -32px) scale(.5); opacity: 0; }

      0%   { transform: translateY(8px) scaleX(.8); opacity: 0; }

    }

    @keyframes chStreamOut {

    }
    @keyframes chFadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes chCremaIn {

<div style="width: 360px; height: 800px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.24); background: var(--gray-900, #16161a);">

  <div style="position: absolute; z-index: 7; top: 0; left: 50%; width: 2px; height: 368px; transform: translateX(calc(-50% - 1px)); overflow: hidden; opacity: .5; animation: chFadeIn 300ms ease 1000ms backwards, chFadeOut 500ms ease 4180ms forwards; background: linear-gradient(180deg, rgba(200,155,106,0), rgba(200,155,106,.55) 12%, rgba(200,155,106,.55) 88%, rgba(200,155,106,0));">
    <div style="position: absolute; inset: 0 0 auto 0; height: 74px; border-radius: 999px; background: linear-gradient(180deg, rgba(240,214,186,0), rgba(240,214,186,.95), rgba(240,214,186,0)); animation: chGlint 900ms linear 1060ms 3 both;"></div>
    <div style="position: absolute; inset: 0 0 auto 0; height: 52px; border-radius: 999px; background: linear-gradient(180deg, rgba(240,214,186,0), rgba(240,214,186,.75), rgba(240,214,186,0)); animation: chGlint 900ms linear 1510ms 3 both;"></div>
  </div>
  <div style="position: absolute; z-index: 7; top: 0; left: 50%; width: 22px; height: 368px; transform: translateX(-50%); border-radius: 0 0 999px 999px; background: radial-gradient(closest-side, rgba(169,113,63,.26), transparent 74%); filter: blur(7px); animation: chFadeIn 300ms ease 1000ms backwards, chStreamSway 2600ms ease-in-out 1620ms infinite, chFadeOut 620ms ease 4180ms forwards;"></div>

  <div style="position: absolute; z-index: 7; top: 0; left: calc(50% - 11px); width: 11px; height: 16px; border-radius: 50% 50% 58% 58%; background: radial-gradient(at 32% 30%, #C89B6A, #4A2A17 55%, #1C0E06); transform: translate(-50%, -32px) scale(.5); animation: chDrop 1300ms cubic-bezier(.4,0,1,1) 1140ms 3 both;"></div>

  <!-- Contact shadow where the pour enters the coffee -->
  <div style="position: absolute; z-index: 8; top: 363px; left: 50%; transform: translateX(-50%); width: 24px; height: 9px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,0)); filter: blur(2px); animation: chFadeIn 400ms ease 1660ms both, chFadeOut 500ms ease 4180ms forwards;"></div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0, progress: 0 };
  DURATION = 7000;
  quotes = [
    { text: "\u201CI'd rather take coffee than compliments just now.\u201D", author: "Louisa May Alcott" },

  ];
  componentDidMount() {
    this.timer = setInterval(
      () => this.setState((s) => ({ i: (s.i + 1) % this.quotes.length })),
      this.DURATION / this.quotes.length
    );
    this.start = Date.now();
    this.tick = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - this.start) / this.DURATION) * 100);
      this.setState({ progress: pct });
      if (pct >= 100) {
        clearInterval(this.tick);
        clearInterval(this.timer);
        window.location.href = 'Home Alt.dc.html';
      }
    }, 120);
  }
  componentWillUnmount() { clearInterval(this.timer); clearInterval(this.tick); }
  renderVals() {
    return {
      progress: this.state.progress,
      quotes: this.quotes.map((q, idx) => ({ ...q, o: idx === this.state.i ? 1 : 0 })),
    };
  }
}
</script>
