<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/primitives.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/brand.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/typography.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/radius.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/sizing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/motion.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/components.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/base.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/styles.css">
  <script src="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
  <div style="position: absolute; inset: 0; z-index: 80; background: var(--color-bg-surface); display: flex; flex-direction: column; font-family: var(--font-family-base);">
    <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; justify-content: center; gap: var(--space-lg); padding: var(--space-xl) var(--space-base);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-base); text-align: center;">
        <div style="width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--color-bg-success); display: flex; align-items: center; justify-content: center;">
          <i class="ph-fill ph-check-circle" aria-hidden="true" style="font-size: 40px; color: var(--color-status-success);"></i>
        </div>
        <h1 style="margin: 0; font-size: var(--font-size-h1); line-height: var(--line-height-h1); font-weight: var(--font-weight-bold); color: var(--color-text-primary); text-wrap: pretty;">Your order has been successfully placed!</h1>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
        <div style="display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-base); border-radius: var(--radius-md); background: var(--color-bg-canvas, var(--gray-50)); border: var(--border-width-default) solid var(--color-border-muted);">
          <i class="ph ph-map-pin" aria-hidden="true" style="font-size: var(--icon-md); color: var(--color-text-primary); flex: 0 0 auto;"></i>
          <div style="display: flex; flex-direction: column; gap: var(--space-xxs); min-width: 0;">
            <span style="font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-regular); color: var(--color-text-secondary);">Pickup location</span>
            <span style="font-size: var(--font-size-body-lg); line-height: var(--line-height-body-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">{{ location }}</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-base); border-radius: var(--radius-md); background: var(--color-bg-canvas, var(--gray-50)); border: var(--border-width-default) solid var(--color-border-muted);">
          <i class="ph ph-clock" aria-hidden="true" style="font-size: var(--icon-md); color: var(--color-text-primary); flex: 0 0 auto;"></i>
          <div style="display: flex; flex-direction: column; gap: var(--space-xxs);">
            <span style="font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-regular); color: var(--color-text-secondary);">Pickup time</span>
            <span style="font-size: var(--font-size-body-lg); line-height: var(--line-height-body-lg); font-weight: var(--font-weight-semibold); color: var(--color-text-primary);">{{ time }}</span>
          </div>
        </div>
      </div>
    </div>
    <div style="flex: 0 0 auto; padding: var(--space-base); background: var(--color-bg-surface); border-top: var(--border-width-default) solid var(--color-border-muted);">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.Button" variant="primary" size="sm" full-width="{{ true }}" on-click="{{ onTrack }}" hint-size="100%,40px">Track order</x-import>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:800},&quot;visible&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;location&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tigran Petrosyan 31/5 (near Davtashen Yerevan City)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ASAP&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onTrack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      visible: this.props.visible ?? true,
      location: this.props.location ?? 'Tigran Petrosyan 31/5 (near Davtashen Yerevan City)',
      time: this.props.time ?? 'ASAP',
      onTrack: this.props.onTrack ?? (() => {}),
    };
  }
}
</script>
</body>
</html>
