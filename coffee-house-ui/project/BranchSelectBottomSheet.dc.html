<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/primitives.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/brand.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/typography.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/radius.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/sizing.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/motion.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/components.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/base.css">
  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/styles.css">
  <script src="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<x-import component-from-global-scope="GastroDesignSystem_472aed.BottomSheet" open="{{ open }}" on-close="{{ onClose }}" title="Choose branch" hint-size="100%,auto">
  <div style="display: flex; flex-direction: column; gap: var(--space-base);">
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Dropdown" value="{{ city }}" options="{{ cityOptions }}" on-change="{{ setCity }}" hint-size="100%,40px"></x-import>
    <div style="overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--space-base) * -1); padding: 0 var(--space-base);">
      <div style="width: max-content;">
        <x-import component-from-global-scope="GastroDesignSystem_472aed.TabBar" options="{{ districtOptions }}" value="{{ district }}" on-change="{{ setDistrict }}" size="xs" hint-size="auto,32px"></x-import>
      </div>
    </div>
    <div style="max-height: 320px; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: var(--space-md);">
      <sc-for list="{{ branchList }}" as="branch" hint-placeholder-count="5">
        <x-import component-from-global-scope="GastroDesignSystem_472aed.BranchSelectorCard" name="{{ branch.name }}" address="{{ branch.address }}" distance="{{ branch.distance }}" image="{{ branch.image }}" checked="{{ branch.checked }}" on-change="{{ branch.select }}" hint-size="100%,72px"></x-import>
        <sc-if value="{{ branch.showDivider }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="GastroDesignSystem_472aed.Divider" hint-size="100%,1px"></x-import>
        </sc-if>
      </sc-for>
    </div>
    <x-import component-from-global-scope="GastroDesignSystem_472aed.Button" variant="primary" size="sm" full-width="{{ true }}" on-click="{{ choose }}" hint-size="100%,40px">Choose</x-import>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Northern Avenue&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onChoose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(branch) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { city: 'yerevan', district: 'kentron', selected: null };
  branchData = [
    { name: 'Northern Avenue', address: '12 Northern Ave, Yerevan', distance: '0.4 km', image: 'uploads/branch_1.png' },
    { name: 'Cascade', address: '3 Tamanyan St, Yerevan', distance: '1.1 km', image: 'uploads/branch_2.png' },
    { name: 'Republic Square', address: '5 Abovyan St, Yerevan', distance: '1.8 km', image: 'uploads/branch_3.png' },
    { name: 'Komitas', address: '28 Komitas Ave, Yerevan', distance: '2.3 km', image: 'uploads/branch_1.png' },
    { name: 'Saryan Street', address: '14 Saryan St, Yerevan', distance: '2.9 km', image: 'uploads/branch_2.png' },
  ];
  renderVals() {
    const sel = this.state.selected ?? this.props.selected ?? 'Northern Avenue';
    const n = this.branchData.length;
    return {
      open: this.props.open ?? false,
      onClose: this.props.onClose ?? (() => {}),
      city: this.state.city,
      cityOptions: [{ label: 'Yerevan', value: 'yerevan' }, { label: 'Gyumri', value: 'gyumri' }, { label: 'Vanadzor', value: 'vanadzor' }, { label: 'Dilijan', value: 'dilijan' }],
      setCity: (v) => this.setState({ city: v }),
      districtOptions: ['Kentron', 'Arabkir', 'Ajapnyak', 'Masiv', 'Erebuni'].map((d) => ({ label: d, value: d.toLowerCase() })),
      district: this.state.district,
      setDistrict: (v) => this.setState({ district: v }),
      branchList: this.branchData.map((b, i) => ({ ...b, showDivider: i < n - 1, checked: b.name === sel, select: () => this.setState({ selected: b.name }) })),
      choose: () => {
        const b = this.branchData.find((x) => x.name === sel) || this.branchData[0];
        (this.props.onChoose ?? (() => {}))(b);
        this.setState({ selected: null });
      },
    };
  }
}
</script>
</body>
</html>
