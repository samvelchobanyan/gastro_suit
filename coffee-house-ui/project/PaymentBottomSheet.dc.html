<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <link rel="stylesheet" href="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/tokens/sizing.css">

  <script src="_ds/gastro-design-system-472aed14-5ab5-4e18-af6e-e4acf17165d4/_ds_bundle.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</helmet>
<x-import component-from-global-scope="GastroDesignSystem_472aed.BottomSheet" open="{{ open }}" on-close="{{ onClose }}" title="Choose payment method" hint-size="100%,auto">
  <div style="display: flex; flex-direction: column; gap: var(--space-sm);">
    <sc-for list="{{ methods }}" as="method" hint-placeholder-count="4">
      <x-import component-from-global-scope="GastroDesignSystem_472aed.PaymentMethods" icon="{{ method.icon }}" name="{{ method.name }}" balance="{{ method.balance }}" chevron="{{ false }}" on-click="{{ method.onClick }}" hint-size="100%,48px"></x-import>
    </sc-for>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(method: any) =&gt; void&quot;}}">
class Component extends DCLogic {
  methodData = [
    { id: 'card', name: 'Visa •••• 4242', icon: 'credit-card', balance: '֏12,400' },
    { id: 'wallet', name: 'Wallet', icon: 'wallet', balance: '֏3,850' },
    { id: 'loyalty', name: 'Loyalty points', icon: 'star', balance: '1,240 pts' },
    { id: 'voucher', name: 'Voucher', icon: 'ticket', balance: '2 available' },
  ];
  renderVals() {
    const onSelect = this.props.onSelect ?? (() => {});
    return {
      open: this.props.open ?? false,
      onClose: this.props.onClose ?? (() => {}),
      methods: this.methodData.map((m) => ({ ...m, onClick: () => onSelect(m) })),
    };
  }
}
</script>
</body>
</html>
